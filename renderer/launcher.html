<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>SC Companion launcher</title>
<style>
  html, body { margin: 0; width: 64px; height: 64px; overflow: hidden; background: transparent; user-select: none; -webkit-user-select: none; }
  body.opaque { background: #080c14; }
  #b {
    position: absolute; left: 6px; top: 6px; width: 48px; height: 48px; border-radius: 50%; box-sizing: content-box;
    background: radial-gradient(circle at 35% 28%, #12294a 0%, #08101e 72%);
    border: 2px solid #00aaff; box-shadow: 0 0 12px rgba(0, 170, 255, 0.55);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  #b:hover { transform: scale(1.07); box-shadow: 0 0 18px rgba(0, 170, 255, 0.9); }
  #b:active { transform: scale(0.96); }
  #b.drag { cursor: grabbing; }
  #b img { width: 34px; height: 34px; pointer-events: none; -webkit-user-drag: none; }
  #n {
    position: absolute; right: 1px; top: 1px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box;
    border-radius: 9px; background: #00cc66; color: #02140a; font: 700 11px 'Segoe UI', Arial, sans-serif;
    display: none; align-items: center; justify-content: center; box-shadow: 0 0 0 2px #08101e; pointer-events: none;
  }
  #n.on { display: flex; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 12px rgba(0, 204, 102, 0.5); } 50% { box-shadow: 0 0 22px rgba(0, 204, 102, 1); } }
  #b.pulse { animation: pulse 1.1s ease-in-out 4; border-color: #00cc66; }
  @media (prefers-reduced-motion: reduce) { #b, #b.pulse { animation: none; transition: none; } }
</style>
</head>
<body>
  <div id="b" title="SC Companion: click to open, drag to move, right-click for options">
    <img src="../icon.png" alt="SC Companion" draggable="false">
    <div id="n"></div>
  </div>
<script>
  if (new URLSearchParams(location.search).get('opaque') === '1') document.body.classList.add('opaque');
  const b = document.getElementById('b'), n = document.getElementById('n');
  let last = 0;
  // A press on the bubble starts a drag. The page tracks it with a flag (not with pointer capture alone) and
  // listens on the whole window; capture is still requested so a fast pointer cannot outrun the bubble.
  let dragging = false;
  b.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    dragging = true;
    try { b.setPointerCapture(e.pointerId); } catch { /* the window-level listeners still follow the drag */ }
    b.classList.add('drag');
    window.launcher.down();
  });
  window.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    window.launcher.move();
  });
  function finish() {
    if (!dragging) return;
    dragging = false;
    b.classList.remove('drag');
    window.launcher.up();
  }
  window.addEventListener('pointerup', finish);
  window.addEventListener('pointercancel', finish);
  b.addEventListener('contextmenu', (e) => { e.preventDefault(); window.launcher.menu(); });
  window.launcher.onBadge((count) => {
    n.textContent = count > 9 ? '9+' : String(count);
    n.classList.toggle('on', count > 0);
    b.title = count > 0 ? `SC Companion: ${count} refinery job${count === 1 ? '' : 's'} ready. Click to open.` : 'SC Companion: click to open, drag to move, right-click for options';
    if (count > last) { b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse'); }
    last = count;
  });
</script>
</body>
</html>
